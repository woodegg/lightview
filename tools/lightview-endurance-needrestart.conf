# Defer automatic restarts of dedicated Lightview endurance test units.
# Install as /etc/needrestart/conf.d/lightview-endurance.conf on the test host.
# Package updates and restart policy for other services remain enabled.
$nrconf{override_rc}->{qr(^lightview-redirect-budget-24h-[0-9]{8}-[0-9]{6}(?:-(?:driver|observer|sampler|cgroup-sampler|audit|failure-capture-v3|native-failure))?\.service$)} = 0;
